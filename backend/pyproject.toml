[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # 图谱存储（本地，替代 Zep Cloud）
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    # 修复（OASIS 启动崩溃）：camel-ai 0.2.78 + mcp 1.24 与 pydantic>=2.11 不兼容
    # （pydantic._internal.model_construction 在 import 时 KeyError）
    # 锁定 pydantic<2.11，让 OASIS sub-process 能正常启动
    "pydantic>=2.0.0,<2.11",
]

[project.optional-dependencies]
zep = [
    # Zep Cloud Standalone Graph 后端；仅在 GRAPH_BACKEND=zep 时需要。
    # 默认 GRAPH_BACKEND=local，本地 GraphStore 不依赖 zep-cloud。
    "zep-cloud>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
